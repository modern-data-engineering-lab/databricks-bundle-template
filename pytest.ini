[pytest]
# Adds the repo root to the Python module search path so tests can `import src...`
# without manual sys.path hacking, whether run locally, in CI, or from a Databricks job.
pythonpath = .

# Import tests via importlib rather than legacy path-insertion — more predictable in
# environments with unusual paths (like a Databricks Workspace).
addopts = --import-mode=importlib

filterwarnings = ignore::DeprecationWarning
