###########################################################################################
# Main Databricks Asset Bundle configuration.
#
# This bundle deploys a small, deliberately generic ETL project (orders bronze/silver/gold
# via a Lakeflow Declarative Pipeline, plus a job that runs unit tests, the pipeline, and a
# report notebook). The point of this repo isn't the ETL itself — it's the deployment shape:
# dev/staging/prod targets, variable overrides per target, and a working CI/CD workflow.
#
# Fork this repo (or copy resources/ + databricks.yml) as the starting point for a new
# Databricks project instead of hand-rolling bundle config from scratch each time.
#
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
###########################################################################################

bundle:
  name: databricks_bundle_template

include:
  - "./resources/variables.yml"
  - "./resources/pipeline/example_etl_pipeline.pipeline.yml"
  - "./resources/job/etl_workflow.job.yml"

targets:
  dev:
    # Deployed resources are prefixed with '[dev <user>]' and job schedules/triggers are
    # paused by default — see https://docs.databricks.com/dev-tools/bundles/deployment-modes.html
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dev_catalog

  staging:
    mode: development
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: staging_catalog

  prod:
    mode: production
    workspace:
      # Deploy under a shared path, not a personal user folder, so production doesn't
      # depend on any one person's workspace identity.
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: prod_catalog
      notification_email: data-alerts@example.com
    # Despite the field name, this must be the service principal's Application ID (a UUID —
    # shown as "Client ID" on its page), not its display name. `bundle validate` won't catch
    # a wrong value here since it's schema-only; only a real `bundle deploy` resolves it
    # against the workspace and fails with "cannot be set as run_as service principal,
    # because it doesn't exist" if it's a display name or doesn't match. Replace this with
    # YOUR prod service principal's own Application ID from Getting Started step 3.
    run_as:
      service_principal_name: 2be2a270-a0ed-44fa-8810-1b869f8d6cc3
