######################################
# Lakeflow Declarative Pipeline (SDP) #
######################################
resources:
  pipelines:
    example_etl_pipeline:
      name: example_etl_pipeline_${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      photon: true
      # Bundle root, not src/pipelines — a pipeline only reliably syncs library files that
      # live under its own root_path, and the integration test lives outside src/pipelines.
      root_path: ../..
      libraries:
        - glob:
            include: ../../src/pipelines/ingest_bronze_silver.py
        - glob:
            include: ../../src/pipelines/gold_tables.sql
        - glob:
            include: ../../tests/integration_test/integration_tests_pipeline.py
      configuration:
        target: ${bundle.target}
        raw_data_path: ${var.raw_data_path}
