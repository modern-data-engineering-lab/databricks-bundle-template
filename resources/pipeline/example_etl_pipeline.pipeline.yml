######################################
# Lakeflow Declarative Pipeline (SDP) #
######################################
resources:
  pipelines:
    example_etl_pipeline:
      name: example_etl_pipeline_${bundle.target}
      catalog: ${var.catalog}
      schema: ${var.schema}
      serverless: true
      photon: true
      # All library files below live directly under this root_path — widening root_path to
      # the bundle root (tried previously) did not fix a LIBRARY_FILE_NOT_FOUND error for a
      # file living outside src/pipelines; moving the file itself in here did. Keep every
      # pipeline library file physically co-located here, not reached via a separate ../../
      # path into another top-level directory.
      root_path: ../../src/pipelines
      libraries:
        - glob:
            include: ../../src/pipelines/ingest_bronze_silver.py
        - glob:
            include: ../../src/pipelines/gold_tables.sql
        - glob:
            include: ../../src/pipelines/integration_tests.py
      configuration:
        target: ${bundle.target}
        raw_data_path: ${var.raw_data_path}
